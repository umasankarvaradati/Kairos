services:
  postgres:
    image: postgres:16-alpine
    container_name: applytrack-postgres
    environment:
      POSTGRES_DB: kairos
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
    ports:
      - "5433:5432"
    volumes:
      - applytrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  applytrack-postgres-data:
