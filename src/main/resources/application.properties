spring.application.name=applytrack

spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

server.error.include-message=never

server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-hours=24
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}
app.mail.from=${MAIL_FROM:umasankar.varadati@gmail.com}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
