spring.application.name=kairos

spring.datasource.url=jdbc:postgresql://ep-broad-heart-ay53aflf-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
